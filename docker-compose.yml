version: "1.0"
name: biokb_coconut

services:
  api:
    build: .
    container_name: biokb_coconut
    environment:
      CONNECTION_STR: ${CONNECTION_STR}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_URI: ${NEO4J_URI}
      COCONUT_API_USERNAME: ${COCONUT_API_USERNAME}
      COCONUT_API_PASSWORD: ${COCONUT_API_PASSWORD}
    ports:
      - ${COCONUT_API_PORT}:8000
    volumes:
      - ~/.biokb/coconut:/root/.biokb/coconut

networks:
  default:
    name: biokb_network
    external: true